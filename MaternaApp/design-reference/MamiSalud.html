<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MamiSalud — Pantallas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="system.css" />
  <style>
    body { background: #FBE7EF; }
    .mamilabel {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      color: #4A3942;
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="android-frame.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="screen-home.jsx"></script>
  <script type="text/babel" src="screen-chat.jsx"></script>
  <script type="text/babel" src="screen-alerts.jsx"></script>
  <script type="text/babel" src="screen-controls.jsx"></script>
  <script type="text/babel" src="screen-calc.jsx"></script>

  <script type="text/babel">
    const PHONE_W = 360;
    const PHONE_H = 760;

    function PhoneShell({ children }) {
      // Wrap in AndroidDevice (no title bar, status + nav only)
      return (
        <AndroidDevice width={PHONE_W} height={PHONE_H}>
          {children}
        </AndroidDevice>
      );
    }

    function App() {
      return (
        <DesignCanvas title="MamiSalud" subtitle="App móvil para gestantes adolescentes — Ucayali, Perú">
          <DCSection id="screens" title="Pantallas principales" subtitle="5 pantallas · Android · 360 × 760">
            <DCArtboard id="home"     label="01 · Inicio"             width={PHONE_W} height={PHONE_H} data-screen-label="01 Inicio">
              <PhoneShell><ScreenHome/></PhoneShell>
            </DCArtboard>
            <DCArtboard id="chat"     label="02 · Mami-bot"           width={PHONE_W} height={PHONE_H} data-screen-label="02 Mami-bot">
              <PhoneShell><ScreenChat/></PhoneShell>
            </DCArtboard>
            <DCArtboard id="alerts"   label="03 · Señales de alarma"  width={PHONE_W} height={PHONE_H} data-screen-label="03 Señales de alarma">
              <PhoneShell><ScreenAlerts/></PhoneShell>
            </DCArtboard>
            <DCArtboard id="controls" label="04 · Registro de control" width={PHONE_W} height={PHONE_H} data-screen-label="04 Registro de control">
              <PhoneShell><ScreenControls/></PhoneShell>
            </DCArtboard>
            <DCArtboard id="calc"     label="05 · Calculadora FUR"    width={PHONE_W} height={PHONE_H} data-screen-label="05 Calculadora FUR">
              <PhoneShell><ScreenCalc/></PhoneShell>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
