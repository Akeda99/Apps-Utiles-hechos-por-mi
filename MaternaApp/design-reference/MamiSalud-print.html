<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MamiSalud — Pantallas (PDF)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="system.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #FBE7EF;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page {
      width: 210mm;
      min-height: 297mm;
      padding: 18mm 0 12mm;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12mm;
      background: #FBE7EF;
      page-break-after: always;
      break-after: page;
    }
    .page:last-child { page-break-after: auto; break-after: auto; }

    .page-header {
      width: 360px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-family: 'Quicksand', sans-serif;
      color: #4A3942;
    }
    .page-header .label {
      font-weight: 700;
      font-size: 18px;
    }
    .page-header .num {
      font-size: 11px;
      font-weight: 700;
      color: #A89AA1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .phone-wrap {
      box-sizing: content-box;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body { background: white; }
      .page {
        page-break-after: always;
        break-after: page;
        background: #FBE7EF;
      }
      .phone-wrap {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="android-frame.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="screen-home.jsx"></script>
  <script type="text/babel" src="screen-chat.jsx"></script>
  <script type="text/babel" src="screen-alerts.jsx"></script>
  <script type="text/babel" src="screen-controls.jsx"></script>
  <script type="text/babel" src="screen-calc.jsx"></script>

  <script type="text/babel">
    const PHONE_W = 360;
    const PHONE_H = 760;

    function PhoneShell({ children }) {
      return (
        <AndroidDevice width={PHONE_W} height={PHONE_H}>
          {children}
        </AndroidDevice>
      );
    }

    const SCREENS = [
      { id: 'home',     n: '01', label: 'Inicio',                 cmp: <ScreenHome/> },
      { id: 'chat',     n: '02', label: 'Mami-bot — chatbot',     cmp: <ScreenChat/> },
      { id: 'alerts',   n: '03', label: 'Señales de alarma',      cmp: <ScreenAlerts/> },
      { id: 'controls', n: '04', label: 'Registro de controles',  cmp: <ScreenControls/> },
      { id: 'calc',     n: '05', label: 'Calculadora de semanas', cmp: <ScreenCalc/> },
    ];

    function App() {
      return (
        <React.Fragment>
          {SCREENS.map(s => (
            <div className="page" key={s.id}>
              <div className="page-header">
                <span className="label">MamiSalud · {s.label}</span>
                <span className="num">{s.n} / 05</span>
              </div>
              <div className="phone-wrap">
                <PhoneShell>{s.cmp}</PhoneShell>
              </div>
            </div>
          ))}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

    // Auto-print after fonts and JSX are ready
    (async () => {
      try { await document.fonts.ready; } catch (e) {}
      // Wait a bit for React to mount and layout to settle
      setTimeout(() => { window.print(); }, 800);
    })();
  </script>
</body>
</html>
